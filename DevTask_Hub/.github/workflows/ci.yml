name: DevTask Hub CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare build output
        run: |
          mkdir -p dist
          cp index.html dist/
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: devtask-hub-dist
          path: dist/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Run tests
        run: node test.js
